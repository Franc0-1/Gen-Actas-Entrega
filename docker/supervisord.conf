[supervisord]
nodaemon=true
user=root

[program:soffice]
command=/usr/bin/soffice --headless --invisible --nologo --nodefault --norestore --nofirststartwizard --nolockcheck --accept=socket,host=127.0.0.1,port=2002;urp;StarOffice.ComponentContext
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/app/server
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
