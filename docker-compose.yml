services:
  actas:
    build: .
    container_name: gen-actas-entrega
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: gen-actas-caddy
    restart: unless-stopped
    depends_on:
      - actas
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
