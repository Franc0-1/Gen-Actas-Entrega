<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de Actas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div>
        <h1>Generar actas de entrega</h1>
        <p class="subtitle">Completá los datos para generar el acta en PDF, lista para descargar.</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar a modo oscuro">🌙</button>
    </div>

    <form id="acta-form">
      <section class="form-section">
        <h2>Datos del acta</h2>
        <div class="form-grid">
          <label>
            Fecha
            <input type="date" id="fecha" required>
          </label>

          <label>
            Tipo de acta
            <select id="tipo">
              <option value="entrega">Entrega</option>
              <option value="recibimiento">Recibimiento</option>
              <option value="ambos">Ambos</option>
            </select>
          </label>

          <label>
            Área/Departamento
            <select id="areaDepartamento" required>
              <option value="" selected disabled>Seleccionar...</option>
              <option value="Prensa">Prensa</option>
              <option value="Área 2">Oficina Privada</option>
              <option value="Municipios PB">Municipios PB</option>
              <option value="Comunicación">Comunicación</option>
              <option value="otros">Otros</option>
            </select>
          </label>

          <label id="areaDepartamentoOtraLabel" hidden>
            Especificar área/departamento
            <input type="text" id="areaDepartamentoOtra">
          </label>
        </div>
      </section>

      <section class="form-section">
        <h2>Participantes</h2>
        <div class="form-grid">
          <label>
            Quien presenta
            <input type="text" id="quienEntrega" value="Oficina de Sistemas" required>
          </label>

          <label>
            Quién recibe
            <input type="text" id="quienRecibe" required>
          </label>
        </div>
      </section>

      <section class="form-section">
        <h2>Elementos</h2>
        <div class="elementos-list">
        <div class="elementos-header" aria-hidden="true">
              <span>Descripción</span>
              <span>Nro. Inv</span>
              <span>Cantidad</span>
              <span class="col-direccion">Dirección</span>
              <span>Observación</span>
              <span></span> 
            </div>
          <div id="elementos-container"></div>
        </div>
        <button type="button" id="agregar-elemento" class="btn btn-secondary">+ Agregar elemento</button>
      </section>

      <section class="form-section form-section--acciones">
        <div class="acciones-form">
          <button type="submit" class="btn btn-primary">Generar Acta</button>
        </div>
      </section>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
